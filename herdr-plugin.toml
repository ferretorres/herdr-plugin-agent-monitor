id = "ferretorres.agent-monitor"
name = "agent-monitor"
version = "0.5.0"
description = "What the agents on this herdr server are doing and using: goal, last prompt, current action, context, tokens, cost"
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

[[panes]]
id = "monitor"
title = "Agent monitor"
command = ["python3", "monitor.py"]
placement = "split"

[[actions]]
id = "open"
title = "Agent monitor"
description = "Every agent on this herdr server"
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin ferretorres.agent-monitor --entrypoint monitor"]
contexts = ["global"]

# Opens a split next to the focused pane of the action's workspace, scoped with
# AGENT_MONITOR_SCOPE=workspace (see open_workspace_args in monitor.py).
[[actions]]
id = "open-workspace"
title = "Agent monitor (this workspace)"
description = "Only the agents in this workspace, leads first with their workers"
command = ["python3", "monitor.py", "--open-workspace"]
contexts = ["workspace"]

# Keeps the optional sidebar row (am_* tokens) and the context-90% toast current while no monitor
# pane is open. One short process per agent status change.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "monitor.py", "--hook"]
